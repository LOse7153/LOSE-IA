name: Build LOSE IA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extraire le projet Android
        run: |
          set -e
          rm -rf android-project
          mkdir -p android-project
          unzip -q LOSE-IA-projet.zip -d android-project

      - name: Trouver le projet Gradle
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find android-project -type f -name gradlew -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          else
            SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "Aucun projet Gradle Android trouvé dans LOSE-IA-projet.zip"
              find android-project -maxdepth 4 -type f | head -100
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projet Android trouvé dans : $PROJECT_DIR"

      - name: Construire l'APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: LOSE-IA-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
