name: Build LOSE IA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Construire APK LOSE IA
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Vérifier le fichier du projet
        run: |
          set -e
          echo "Contenu du dépôt :"
          ls -la

          if [ ! -f "LOSE-IA-projet.zip" ]; then
            echo "ERREUR : LOSE-IA-projet.zip est introuvable."
            exit 1
          fi

      - name: Extraire le projet Android
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q LOSE-IA-projet.zip -d android-project

          echo "Projet extrait."
          find android-project -maxdepth 4 -type f | head -100

      - name: Trouver le projet Gradle
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find android-project -type f -name "gradlew" -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          else
            SETTINGS=$(find android-project -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERREUR : Aucun projet Gradle Android trouvé."
              echo "Fichiers trouvés :"
              find android-project -maxdepth 5 -type f
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "Projet Android trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Vérifier Gradle Wrapper
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERREUR : gradlew est absent du projet Android."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle Wrapper trouvé."
          ./gradlew --version

      - name: Construire l'APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Vérifier l'APK
        run: |
          set -e

          echo "Recherche de l'APK..."

          find android-project \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: LOSE-IA-debug-apk
          path: |
            android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
